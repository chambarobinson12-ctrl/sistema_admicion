{% extends 'base.html' %}
{% block title %}Ayuda - ISTAM Admisión{% endblock %}

{% block content %}
    <div class="tarjeta" style="max-width:560px; margin:0 auto;">
        <h1 style="font-size:20px; margin-bottom:10px;">Ayuda</h1>
        <p style="font-size:13.5px; color:var(--texto-muted); margin-bottom:16px;">Si tienes dudas sobre el proceso de admisión, contáctanos:</p>
        <div class="datos-lista">
            <div class="datos-item">
                <span class="datos-item-texto">
                    <span class="datos-item-etiqueta">Correo</span>
                    <span class="datos-item-valor">admision@istam.edu.ec</span>
                </span>
            </div>
            <div class="datos-item">
                <span class="datos-item-texto">
                    <span class="datos-item-etiqueta">Teléfono</span>
                    <span class="datos-item-valor">(06) 000-0000</span>
                </span>
            </div>
            <div class="datos-item">
                <span class="datos-item-texto">
                    <span class="datos-item-etiqueta">Horario de atención</span>
                    <span class="datos-item-valor">Lunes a viernes, 8:00 - 16:00</span>
                </span>
            </div>
        </div>
    </div>
{% endblock %}
